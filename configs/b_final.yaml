# Tier B: headline run, winning attention/FFN combo from the tier-A ablation.
# Edit `attention` / `ffn` below once the tier-A results pick a winner.
run_name: b_final
data_dir: data_b

model:
  vocab_size: 8192
  dim: 512
  n_layers: 12
  n_heads: 8
  seq_len: 512
  tie_embeddings: true
  attention: differential   # set to "standard" if diff-attn didn't win tier A
  rope_theta: 10000.0
  ffn: moe                  # set to "dense" if MoE didn't win tier A
  inter_dim: 1536
  n_dense_layers: 2
  n_experts: 16
  top_k: 2
  expert_inter_dim: 768     # top_k * 768 = 1536 -> parity with dense inter_dim
  n_shared_experts: 1
  shared_inter_dim: 768
  aux_loss_coef: 0.01
  router_z_coef: 0.001
  norm_eps: 1.0e-6

train:
  batch_size: 16
  accum_steps: 8
  max_steps: 7000
  lr: 2.5e-4
  min_lr_ratio: 0.1
  warmup_steps: 140
  weight_decay: 0.1
  grad_clip: 1.0
  amp: true
  log_freq: 20
  eval_freq: 500
  eval_batches: 50
  ckpt_freq: 500
  seed: 42
