# Scale-up tier S, Run D: differential attention + MoE FFN (the repo's thesis)
# Identical to s_dense except attention AND ffn. See s_dense.yaml for data-prep notes.
run_name: s_diffmoe
data_dir: data_s

model:
  vocab_size: 100352
  dim: 896
  n_layers: 16
  n_heads: 14
  seq_len: 512
  tie_embeddings: true
  attention: differential
  rope_theta: 10000.0
  ffn: moe
  inter_dim: 3584
  n_dense_layers: 2
  n_experts: 6             # 6 not 8 so all experts fit T4 VRAM under fp32 AdamW;
                           # raw ~565M, active UNCHANGED. See s_moe.yaml for why.
  top_k: 2
  expert_inter_dim: 1792
  n_shared_experts: 0
  aux_loss_coef: 0.01
  router_z_coef: 0.001
  norm_eps: 1.0e-6

train:
  batch_size: 4
  accum_steps: 32
  max_steps: 2900
  lr: 2.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 60
  weight_decay: 0.1
  grad_clip: 1.0
  amp: true
  log_freq: 20
  eval_freq: 250
  eval_batches: 50
  ckpt_freq: 250
  max_best_checkpoints: 2
  seed: 42
